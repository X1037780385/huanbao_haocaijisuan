<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>环保专业耗量计算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h2 {
            text-align: center;
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .group {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .group-title {
            font-size: 16px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .input-item {
            margin-bottom: 12px;
        }
        .input-item label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
        }
        .input-item input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px; /* 防止iOS自动放大 */
            border: 1px solid #ccc;
            border-radius: 4px;
            appearance: none; /* 移除默认样式 */
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,123,255,0.2);
        }
        .btn:active {
            background-color: #0056b3;
        }
        .btn-copy {
            background-color: #28a745;
            box-shadow: 0 4px 6px rgba(40,167,69,0.2);
        }
        .btn-copy:active {
            background-color: #1e7e34;
        }
        textarea {
            width: 100%;
            height: 180px;
            box-sizing: border-box;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h2>环保专业耗量计算器</h2>

    <form id="calcForm">
        <!-- 组别1：石灰石给料 -->
        <div class="group">
            <div class="group-title">石灰石给料机流量累计</div>
            <div class="input-item"><label>1. 给料机A下料前</label><input type="number" id="v1" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>2. 给料机A下料后</label><input type="number" id="v2" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>3. 给料机B下料前</label><input type="number" id="v3" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>4. 给料机B下料后</label><input type="number" id="v4" step="any" inputmode="decimal"></div>
        </div>

        <!-- 组别2：吸收塔供浆 -->
        <div class="group">
            <div class="group-title">吸收塔供浆流量</div>
            <div class="input-item"><label>5. 一号塔供浆流量1</label><input type="number" id="v5" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>6. 一号塔供浆流量2</label><input type="number" id="v6" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>7. 二号塔供浆流量1</label><input type="number" id="v7" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>8. 二号塔供浆流量2</label><input type="number" id="v8" step="any" inputmode="decimal"></div>
        </div>

        <!-- 组别3：尿素储罐液位 -->
        <div class="group">
            <div class="group-title">尿素储罐液位</div>
            <div class="input-item"><label>9. 储罐A使用后</label><input type="number" id="v9" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>10. 储罐A使用前</label><input type="number" id="v10" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>11. 储罐B使用后</label><input type="number" id="v11" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>12. 储罐B使用前</label><input type="number" id="v12" step="any" inputmode="decimal"></div>
        </div>

        <!-- 组别4：脱硝氨气流量 -->
        <div class="group">
            <div class="group-title">脱硝氨气流量累计</div>
            <div class="input-item"><label>13. 1炉A侧流量1</label><input type="number" id="v13" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>14. 1炉A侧流量2</label><input type="number" id="v14" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>15. 1炉B侧流量1</label><input type="number" id="v15" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>16. 1炉B侧流量2</label><input type="number" id="v16" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>17. 2炉A侧流量1</label><input type="number" id="v17" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>18. 2炉A侧流量2</label><input type="number" id="v18" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>19. 2炉B侧流量1</label><input type="number" id="v19" step="any" inputmode="decimal"></div>
            <div class="input-item"><label>20. 2炉B侧流量2</label><input type="number" id="v20" step="any" inputmode="decimal"></div>
        </div>
    </form>

    <button type="button" class="btn" onclick="generateTemplate()">开始生成模板</button>
    
    <textarea id="outputResult" readonly placeholder="生成的数据模板将显示在这里..."></textarea>
    
    <button type="button" class="btn btn-copy" onclick="copyText()">一键复制</button>

    <script>
        function getValue(id) {
            let val = parseFloat(document.getElementById(id).value);
            return isNaN(val) ? 0 : val;
        }

        function getShiftTime() {
            let now = new Date();
            let hour = now.getHours();
            let targetDate = new Date(now);
            let shiftStr = "";

            // 判断班次时间区间
            if (hour >= 20 || hour < 4) {
                shiftStr = "16:00-次日0:00";
                // 如果是凌晨，算作前一天的晚班
                if (hour < 4) {
                    targetDate.setDate(targetDate.getDate() - 1);
                }
            } else if (hour >= 4 && hour < 12) {
                shiftStr = "0:00-8:00";
            } else {
                shiftStr = "8:00-16:00";
            }

            let y = targetDate.getFullYear();
            let m = String(targetDate.getMonth() + 1).padStart(2, '0');
            let d = String(targetDate.getDate()).padStart(2, '0');

            return `${y}年${m}月${d}日 ${shiftStr}`;
        }

        function generateTemplate() {
            // 获取所有20个值
            let v = [];
            for (let i = 1; i <= 20; i++) {
                v[i] = getValue('v' + i);
            }

            // 尿素计算部分
            let ureaBaseVol = ((((Math.abs(v[10] - v[9]) + Math.abs(v[12] - v[11]))/1000) * 3.14 * 1.8 * 1.8 * 1.12) / 2;
            let m1Ammonia = Math.abs(v[14] - v[13]) + Math.abs(v[16] - v[15]);
            let m2Ammonia = Math.abs(v[18] - v[17]) + Math.abs(v[20] - v[19]);
            let totalAmmonia = m1Ammonia + m2Ammonia;
            
            // 防止除以0导致NaN错误
            let m1Urea = totalAmmonia === 0 ? 0 : ureaBaseVol * (m1Ammonia / totalAmmonia);
            let m2Urea = totalAmmonia === 0 ? 0 : ureaBaseVol * (m2Ammonia / totalAmmonia);

            // 石灰石计算部分
            let limestoneBase = ((Math.abs(v[1] - v[2]) + Math.abs(v[3] - v[4])) / 100) * 1.25;
            let m1Slurry = Math.abs(v[6] - v[5]);
            let m2Slurry = Math.abs(v[8] - v[7]);
            let totalSlurry = m1Slurry + m2Slurry;

            let m1Limestone = totalSlurry === 0 ? 0 : limestoneBase * (m1Slurry / totalSlurry);
            let m2Limestone = totalSlurry === 0 ? 0 : limestoneBase * (m2Slurry / totalSlurry);

            // 格式化输出文本 (保留两位小数)
            let timeHeader = getShiftTime();
            let templateText = `${timeHeader}
一号塔
SO2:
NOx:
烟尘：
尿素：${m1Urea.toFixed(2)}
石灰石：${m1Limestone.toFixed(2)}
二号塔
SO2:
NOx:
烟尘：
尿素：${m2Urea.toFixed(2)}
石灰石：${m2Limestone.toFixed(2)}`;

            document.getElementById('outputResult').value = templateText;
        }

        function copyText() {
            let textarea = document.getElementById('outputResult');
            if (!textarea.value) {
                alert("请先生成模板！");
                return;
            }
            // 复制逻辑
            textarea.select();
            textarea.setSelectionRange(0, 99999); // 适配手机端
            
            try {
                navigator.clipboard.writeText(textarea.value).then(() => {
                    alert("复制成功！可以直接粘贴发送了。");
                }).catch(err => {
                    fallbackCopyTextCommand(textarea);
                });
            } catch(e) {
                fallbackCopyTextCommand(textarea);
            }
        }

        function fallbackCopyTextCommand(textarea) {
            document.execCommand('copy');
            alert("复制成功！可以直接粘贴发送了。");
        }
    </script>
</body>
</html>
